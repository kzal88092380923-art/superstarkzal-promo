name: make-reel

on:
  push:
    branches: [main]
    paths:
      - "pet/orders/**.json"
      - "pet/scout/*.json"
      - "pet/bgm/**"
      - "tools/**.py"
      - ".github/workflows/make-reel.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: make-reel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install --quiet pillow edge-tts numpy

      - name: Scout clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          shopt -s nullglob
          for f in pet/scout/*.json; do
            case "$f" in *.result.json) continue;; esac
            if [ ! -f "${f%.json}.jpg" ] || [ "$f" -nt "${f%.json}.jpg" ]; then
              python tools/scout.py "$f"
            fi
          done

      - name: Make reels
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          shopt -s nullglob
          for f in pet/orders/*.json; do
            python tools/make_reel.py "$f"
          done

      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in pet/reels pet/scout pet/voice-cache; do [ -d "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "auto reel build"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
